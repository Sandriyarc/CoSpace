# Konfigurasi Deployment Netlify untuk CoSpace PWA Frontend

[build]
  publish = "frontend"

# SPA Fallback Redirect
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Header agar service-worker.js tidak disimpan di cache lama (selalu memeriksa pembaruan)
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

# Header untuk manifest.json
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

