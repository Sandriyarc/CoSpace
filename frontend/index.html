<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="CoSpace - Sistem Reservasi dan Pemantauan Jadwal Coworking Space secara Real-time">
  <meta name="theme-color" content="#0d9488">
  <title>CoSpace - Coworking Space</title>
  
  <!-- Manifest & Favicon PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CoSpace">
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-container">
    <!-- Offline Banner Indikator -->
    <div id="offline-banner" class="offline-banner" style="display: none;" role="status">
      <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
      <span>Mode Offline - Membaca data dari cache lokal</span>
    </div>

    <!-- Top Bar / Header Navigasi -->
    <header class="top-bar" id="top-bar">
      <div class="top-bar-content">
        <button id="btn-back" class="btn-icon" aria-label="Kembali" style="display: none;">
          <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>
        <div class="top-bar-title-wrapper">
          <h1 id="page-title" class="top-bar-title">CoSpace</h1>
        </div>
        <div class="top-bar-actions" id="top-bar-actions">
          <!-- Area aksi opsional di header -->
        </div>
      </div>
    </header>

    <!-- Kontainer Utama Tempat Halaman Dirender -->
    <main id="app" class="app-content" role="main"></main>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- Bottom Navigation Bar Tetap di Bawah -->
    <nav class="bottom-nav" id="bottom-nav" aria-label="Navigasi Utama">
      <!-- 1. Beranda -->
      <a href="#/" class="nav-item" data-route="#/">
        <div class="nav-icon-wrapper">
          <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </div>
        <span class="nav-label">Beranda</span>
      </a>

      <!-- 2. Ruangan -->
      <a href="#/rooms" class="nav-item" data-route="#/rooms">
        <div class="nav-icon-wrapper">
          <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
            <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
            <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
            <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
          </svg>
        </div>
        <span class="nav-label">Ruangan</span>
      </a>

      <!-- 3. Jadwal -->
      <a href="#/bookings" class="nav-item" data-route="#/bookings">
        <div class="nav-icon-wrapper">
          <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
        </div>
        <span class="nav-label">Jadwal</span>
      </a>

      <!-- 4. Reservasi (Tombol Tengah Menonjol) -->
      <a href="#/book" class="nav-item nav-item-highlight" data-route="#/book">
        <div class="nav-icon-wrapper nav-icon-accent">
          <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </div>
        <span class="nav-label">Reservasi</span>
      </a>

      <!-- 5. Profil -->
      <a href="#/profile" class="nav-item" data-route="#/profile">
        <div class="nav-icon-wrapper">
          <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <span class="nav-label">Profil</span>
      </a>
    </nav>
  </div>

  <!-- Inisialisasi Aplikasi (ES Modules Native) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
