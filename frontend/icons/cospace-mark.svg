<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Vibrant Purple to Blue) -->
    <linearGradient id="cospace-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Top Ribbon Gradient -->
    <linearGradient id="cospace-top-ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>

    <!-- Bottom Ribbon Gradient -->
    <linearGradient id="cospace-bottom-ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Core Isometric Room Hub -->
    <linearGradient id="cospace-core-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="cospace-core-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="cospace-core-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="cospace-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1E1B4B" flood-opacity="0.28" />
    </filter>
    <filter id="cospace-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#38BDF8" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="url(#cospace-bg)" filter="url(#cospace-shadow)" />
  <rect x="8.75" y="8.75" width="102.5" height="102.5" rx="25.25" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1.5" />

  <!-- Architectural Background Grid Accent -->
  <path d="M8 40 L112 40 M8 64 L112 64 M8 88 L112 88 M40 8 L40 112 M64 8 L64 112 M88 8 L88 112" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" stroke-dasharray="2 3" />

  <!-- Monogram Glyph: Dynamic Continuous "C" Ribbon -->
  <!-- Upper "C" Curve -->
  <path d="M86 36 C86 32.686 83.314 30 80 30 L52 30 C38.745 30 28 40.745 28 54 L28 66 C28 79.255 38.745 90 52 90 L80 90 C83.314 90 86 87.314 86 84 C86 80.686 83.314 78 80 78 L52 78 C45.373 78 40 72.627 40 66 L40 54 C40 47.373 45.373 42 52 42 L80 42 C83.314 42 86 39.314 86 36 Z" fill="url(#cospace-top-ribbon)" filter="url(#cospace-shadow)" />

  <!-- Dynamic Accent Arch Overlay (Cyan Glow at Opening) -->
  <path d="M74 30 L80 30 C83.314 30 86 32.686 86 36 C86 39.314 83.314 42 80 42 L74 42 Z" fill="#38BDF8" opacity="0.9" />
  <path d="M74 78 L80 78 C83.314 78 86 80.686 86 84 C86 87.314 83.314 90 80 90 L74 90 Z" fill="#60A5FA" opacity="0.9" />

  <!-- Center Floating Isometric Workspace Hub (Modular Room / Cube) -->
  <g transform="translate(68, 60)" filter="url(#cospace-glow)">
    <!-- Top Face (Desk / Ceiling) -->
    <path d="M0 -15 L15 -7 L0 1 L-15 -7 Z" fill="url(#cospace-core-top)" />
    <!-- Left Face (Wall) -->
    <path d="M-15 -7 L0 1 L0 17 L-15 9 Z" fill="url(#cospace-core-left)" />
    <!-- Right Face (Doorway / Glass Partition) -->
    <path d="M0 1 L15 -7 L15 9 L0 17 Z" fill="url(#cospace-core-right)" />

    <!-- Interior Desk Indicator Node -->
    <circle cx="0" cy="-6" r="2.2" fill="#FFFFFF" />
    <line x1="0" y1="-4" x2="0" y2="4" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.2" stroke-linecap="round" />
  </g>
</svg>
