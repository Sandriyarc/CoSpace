<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#7C3AED">
  <title>CoSpace - Sedang Offline</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #1E1B4B;
    }

    .offline-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background-color: #FFFFFF;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(124, 58, 237, 0.08);
    }

    .offline-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7C3AED 0%, #2563EB 100%);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 10px 24px rgba(124, 58, 237, 0.28);
    }

    .offline-title {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: #1E1B4B;
      margin-bottom: 10px;
    }

    .offline-desc {
      font-size: 0.92rem;
      color: #6B7280;
      line-height: 1.6;
      margin-bottom: 28px;
      max-width: 320px;
    }

    .btn-retry {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      background: linear-gradient(135deg, #7C3AED 0%, #2563EB 100%);
      color: #FFFFFF;
      border: none;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-retry:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(124, 58, 237, 0.4);
    }

    .btn-retry:active {
      transform: scale(0.96);
    }
  </style>
</head>

<body>
  <div class="offline-container">
    <img src="icons/cospace-logo.svg" alt="CoSpace Logo" width="160" height="40" style="margin-bottom: 24px;">
    <div class="offline-icon">
      <svg viewBox="0 0 24 24" width="40" height="40" stroke="currentColor" stroke-width="2.2" fill="none"
        stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1 class="offline-title">Koneksi Internet Terputus</h1>
    <p class="offline-desc">
      Aplikasi CoSpace tidak dapat terhubung ke server. Silakan periksa koneksi Wi-Fi atau data seluler Anda.
    </p>
    <button class="btn-retry" onclick="window.location.reload()">
      <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none"
        stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
      Coba Muat Ulang
    </button>
  </div>
</body>

</html>
